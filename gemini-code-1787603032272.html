<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Futhark Bi-directionnel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
        }
        .field-group {
            margin-bottom: 20px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .btn-copy {
            background: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: #475569;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: #f8fafc;
            font-size: 1.1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        #runeText {
            font-size: 1.3rem;
            letter-spacing: 0.08em;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Convertisseur Futhark Bi-directionnel</h1>

    <div class="field-group">
        <div class="label-row">
            <label for="latinText">TEXTE LATIN</label>
            <button class="btn-copy" onclick="copier('latinText', this)">Copier</button>
        </div>
        <textarea id="latinText" placeholder="Tape ton texte ici..."></textarea>
    </div>

    <div class="field-group">
        <div class="label-row">
            <label for="runeText">RUNES (ANCIEN FUTHARK)</label>
            <button class="btn-copy" onclick="copier('runeText', this)">Copier</button>
        </div>
        <textarea id="runeText" placeholder="...ᛟᚢ ᛏᚨᛈᛖ ᛏᛖᛋ ᚱᚢᚾᛖᛋ ᛁᚲᛁ"></textarea>
    </div>
</div>

<script>
    const latinToRune = [
        ['th', 'ᚦ'], ['ng', 'ᛝ'], ['ei', 'ᛇ'],
        ['a', 'ᚨ'], ['b', 'ᛒ'], ['c', 'ᚲ'], ['d', 'ᛞ'],
        ['e', 'ᛖ'], ['f', 'ᚠ'], ['g', 'ᚷ'], ['h', 'ᚺ'],
        ['i', 'ᛁ'], ['j', 'ᛃ'], ['k', 'ᚲ'], ['l', 'ᛚ'],
        ['m', 'ᛗ'], ['n', 'ᚾ'], ['o', 'ᛟ'], ['p', 'ᛈ'],
        ['q', 'ᚲ'], ['r', 'ᚱ'], ['s', 'ᛋ'], ['t', 'ᛏ'],
        ['u', 'ᚢ'], ['v', 'ᚹ'], ['w', 'ᚹ'], ['x', 'ᛉ'],
        ['y', 'ᛁ'], ['z', 'ᛉ'],
        ['é', 'ᛖ'], ['è', 'ᛖ'], ['ê', 'ᛖ'], ['à', 'ᚨ'], ['â', 'ᚨ'], ['ù', 'ᚢ']
    ];

    const runeToLatin = [
        ['ᚦ', 'th'], ['ᛝ', 'ng'], ['ᛇ', 'ei'],
        ['ᚨ', 'a'], ['ᛒ', 'b'], ['ᚲ', 'c'], ['ᛞ', 'd'],
        ['ᛖ', 'e'], ['ᚠ', 'f'], ['ᚷ', 'g'], ['ᚺ', 'h'],
        ['ᛁ', 'i'], ['ᛃ', 'j'], ['ᛚ', 'l'], ['ᛗ', 'm'],
        ['ᚾ', 'n'], ['ᛟ', 'o'], ['ᛈ', 'p'], ['ᚱ', 'r'],
        ['ᛋ', 's'], ['ᛏ', 't'], ['ᚢ', 'u'], ['ᚹ', 'v'],
        ['ᛉ', 'z']
    ];

    const latinInput = document.getElementById('latinText');
    const runeInput = document.getElementById('runeText');

    // Saisie côté Latin -> Conversion Runes
    latinInput.addEventListener('input', () => {
        let txt = latinInput.value.toLowerCase();
        for (const [cle, rune] of latinToRune) {
            txt = txt.replaceAll(cle, rune);
        }
        runeInput.value = txt;
    });

    // Saisie côté Runes -> Conversion Latin
    runeInput.addEventListener('input', () => {
        let txt = runeInput.value;
        for (const [rune, latin] of runeToLatin) {
            txt = txt.replaceAll(rune, latin);
        }
        latinInput.value = txt;
    });

    // Fonction de copie dans le presse-papier
    function copier(idElement, btn) {
        const el = document.getElementById(idElement);
        if (!el.value) return;
        
        navigator.clipboard.writeText(el.value).then(() => {
            const txtOriginal = btn.textContent;
            btn.textContent = 'Copié !';
            btn.style.background = '#0284c7';
            setTimeout(() => {
                btn.textContent = txtOriginal;
                btn.style.background = '#334155';
            }, 1200);
        });
    }
</script>

</body>
</html>
