<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Soleil - Particules Sphériques Flottantes</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #010103; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<script>
// 1. Initialisation
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 20, 80); 
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 2. Le Groupe Sun
const sunGroup = new THREE.Group();
scene.add(sunGroup);

// --- 3. Définition des Couches du Soleil ---
const createLayerGeom = (radius) => new THREE.IcosahedronGeometry(radius, 8);

// Core
const coreMesh = new THREE.Mesh(createLayerGeom(10), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
coreMesh.userData = { rotSpeedY: 0.1, rotSpeedX: 0.02 }; 
sunGroup.add(coreMesh);

// Radiative
const radMesh = new THREE.Mesh(createLayerGeom(23), new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
radMesh.userData = { rotSpeedY: 0.02 }; 
sunGroup.add(radMesh);

// Convective
const convMesh = new THREE.Mesh(createLayerGeom(33), new THREE.MeshBasicMaterial({ color: 0xffa500, transparent: true, opacity: 0.2, wireframe: true }));
convMesh.userData = { rotSpeedY: 0.06, rotSpeedZ: 0.02 };
sunGroup.add(convMesh);

// Photosphère
const photoMesh = new THREE.Mesh(createLayerGeom(36), new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
photoMesh.userData = { rotSpeedY: 0.04 };
sunGroup.add(photoMesh);

// Couronne
const coronaMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, side: THREE.BackSide });
const coronaMesh = new THREE.Mesh(createLayerGeom(50), coronaMat);
coronaMesh.userData = { rotSpeedY: -0.01, pulse: 0.02 };
sunGroup.add(coronaMesh);

// Champ EM
const emMesh = new THREE.Mesh(createLayerGeom(60), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.08, wireframe: true, blending: THREE.AdditiveBlending }));
emMesh.userData = { rotSpeedY: 0.02, rotSpeedX: 0.01 };
sunGroup.add(emMesh);


// --- 4. Génération de la Texture Sphérique (Point Rond Adouci) ---
function createCircleTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  // Dégradé radial pour un effet de sphère/orbe lumineuse adoucie
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.3, 'rgba(0, 255, 255, 0.8)');
  gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);

  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

// --- 5. Système de Particules Sphériques Dynamiques ---
const particleCount = 3000;
const particleGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const initialPositions = new Float32Array(particleCount * 3); // Pour conserver le point de départ
const speeds = new Float32Array(particleCount);              // Vitesse individuelle

const boxSize = 220;
for (let i = 0; i < particleCount; i++) {
  const i3 = i * 3;
  const x = (Math.random() - 0.5) * boxSize;
  const y = (Math.random() - 0.5) * boxSize;
  const z = (Math.random() - 0.5) * boxSize;

  positions[i3] = x;
  positions[i3 + 1] = y;
  positions[i3 + 2] = z;

  initialPositions[i3] = x;
  initialPositions[i3 + 1] = y;
  initialPositions[i3 + 2] = z;

  speeds[i] = 0.5 + Math.random() * 1.5; // Vitesse d'oscillation aléatoire
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particleMaterial = new THREE.PointsMaterial({
  color: 0x00ffff,
  size: 1.8,                             // Un peu plus gros pour bien voir les sphères
  map: createCircleTexture(),           // Texture ronde !
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);


// --- 6. Animation ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // Rotations du Soleil
  sunGroup.rotation.y += 0.005 * delta;
  coreMesh.rotation.y += coreMesh.userData.rotSpeedY * delta;
  radMesh.rotation.y += radMesh.userData.rotSpeedY * delta;
  convMesh.rotation.y += convMesh.userData.rotSpeedY * delta;
  photoMesh.rotation.y += photoMesh.userData.rotSpeedY * delta;
  emMesh.rotation.y += emMesh.userData.rotSpeedY * delta;

  // Pulsation Couronne
  const pulseScale = 1 + Math.sin(time * 0.7) * coronaMesh.userData.pulse;
  coronaMesh.scale.set(pulseScale, pulseScale, pulseScale);

  // Animation des Particules : Rotation globale + Mouvement individuel ondulatoire
  particles.rotation.y += 0.001 * delta;

  const posAttr = particleGeometry.attributes.position;
  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const s = speeds[i];
    
    // Petite onde sinusoïdale sur chaque axe pour faire "flotter" la particule
    posAttr.array[i3 + 1] = initialPositions[i3 + 1] + Math.sin(time * s + initialPositions[i3]) * 2.0;
    posAttr.array[i3] = initialPositions[i3] + Math.cos(time * s * 0.5 + initialPositions[i3 + 2]) * 1.5;
  }
  posAttr.needsUpdate = true; // Signale à Three.js de mettre à jour les positions sur le GPU

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
