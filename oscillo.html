<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #050510; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #000210; width: 90%; height: 400px; border: 1px solid #0055ff; box-shadow: 0 0 15px rgba(0,85,255,0.3); }
        button { padding: 10px 20px; font-size: 16px; background: #0055ff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0088ff; }
    </style>
</head>
<body>
    <h2>Oscilloscope Stéréo Matriciel</h2>
    <canvas id="oscillo"></canvas><br><br>
    <button onclick="startOscillo()">Activer la Matrice Audio (Cocher "Partager l'audio")</button>

    <script>
    async function startOscillo() {
        // 1. Capture du flux système
        const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        
        // 2. Séparation des canaux Gauche (0) et Droit (1)
        const splitter = audioContext.createChannelSplitter(2);
        source.connect(splitter);

        // Analyseur Canal Gauche
        const analyserL = audioContext.createAnalyser();
        analyserL.fftSize = 2048;
        splitter.connect(analyserL, 0); // Connecte le canal 0 (Gauche)

        // Analyseur Canal Droit
        const analyserR = audioContext.createAnalyser();
        analyserR.fftSize = 2048;
        splitter.connect(analyserR, 1); // Connecte le canal 1 (Droit)

        const bufferLength = analyserL.frequencyBinCount;
        const dataArrayL = new Uint8Array(bufferLength);
        const dataArrayR = new Uint8Array(bufferLength);

        const canvas = document.getElementById("oscillo");
        const canvasCtx = canvas.getContext("2d");

        function draw() {
            requestAnimationFrame(draw);
            
            // Récupération des deux tampons de données
            analyserL.getByteTimeDomainData(dataArrayL);
            analyserR.getByteTimeDomainData(dataArrayR);

            // Reset du Canvas
            canvasCtx.fillStyle = "rgba(0, 2, 16, 0.3)"; // Effet de traînée lumineuse
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2.5;

            // ---- CANAL GAUCHE : BLEU ÉLECTRIQUE ----
            canvasCtx.strokeStyle = "rgb(0, 100, 255)";
            drawWave(dataArrayL, canvasCtx, canvas.width, canvas.height, bufferLength);

            // ---- CANAL DROIT : CYAN / BLEU TURQUOISE ----
            canvasCtx.strokeStyle = "rgb(0, 240, 255)";
            drawWave(dataArrayR, canvasCtx, canvas.width, canvas.height, bufferLength);
        }

        function drawWave(dataArray, ctx, width, height, bufferLength) {
            ctx.beginPath();
            const sliceWidth = width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * height / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.lineTo(width, height / 2);
            ctx.stroke();
        }

        draw();
    }
    </script>
</body>
</html>
