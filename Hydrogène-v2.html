<!DOCTYPE html>
<html lang="fr">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galibier • Atome Hydrogène chaotique Arc-en-Ciel</title>
        <style>
                :root {
                        --bg-space: #030712;
                        --neon-blue: #60a5fa;
                        --neon-gold: #fbbf24;
                }
                body {
                        margin: 0;
                        background: var(--bg-space);
                        overflow: hidden;
                        color: #e0e7ff;
                        font-family: 'Segoe UI', system-ui, sans-serif;
                        user-select: none;
                }
                #ui {
                        position: absolute;
                        top: 25px;
                        left: 25px;
                        z-index: 20;
                        width: 380px;
                        background: rgba(10,15,30,0.85);
                        padding: 25px;
                        border-radius: 16px;
                        border: 1px solid rgba(96,165,250,0.4);
                        backdrop-filter: blur(12px);
                        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                }
                h1 { font-size: 1.5rem; margin-top: 0; color: white; }
                .data {
                        font-size: 0.8rem;
                        opacity: 0.8;
                        margin-bottom: 20px;
                        font-family: monospace;
                        color: #94a3b8;
                }
                .gemini-controls {
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        margin-bottom: 15px;
                }
                button {
                        background: rgba(30,41,59,0.8);
                        border: 1px solid var(--neon-gold);
                        color: #e0e7ff;
                        padding: 12px 16px;
                        border-radius: 8px;
                        cursor: pointer;
                        transition: all 0.25s;
                        font-size: 0.85rem;
                        font-weight: 600;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                }
                button:hover {
                        background: var(--neon-gold);
                        color: var(--bg-space);
                        box-shadow: 0 0 15px rgba(251,191,36,0.4);
                }
                #output {
                        margin-top: 10px;
                        font-size: 0.85rem;
                        color: var(--neon-gold);
                        line-height: 1.5;
                        background: rgba(0,0,0,0.4);
                        padding: 15px;
                        border-radius: 10px;
                        border-left: 3px solid var(--neon-gold);
                }
                #instructions {
                        position: absolute;
                        bottom: 25px;
                        left: 50%;
                        transform: translateX(-50%);
                        z-index: 15;
                        font-size: 0.75rem;
                        color: rgba(148,163,184,0.6);
                        background: rgba(10,15,30,0.6);
                        padding: 6px 14px;
                        border-radius: 20px;
                        pointer-events: none;
                }
        </style>
        <!-- Chargement de Three.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
        <h1>Galibier • Trajectoire Chaotique Infinitésimale</h1>
        <div class="data">Vol d'Aigle • Trace Persistante Arc-en-Ciel</div>

        <div class="gemini-controls">
                <button onclick="takeSnapshot()">📸 Prenez une capture d'écran</button>
        </div>

        <div id="output">L'électron dessine une toile arc-en-ciel infinie autour du noyau sans jamais s'effacer.</div>
</div>

<div id="instructions">🖱️ Glisse pour pivoter la scène</div>

<script>
        // ==================== VARIABLES GLOBALES & INIT ====================
        let scene, camera, renderer, rotationGroup;
        let coreSphere, coreMaterial, basePositions;
        let trailGeometry, trailPositions, trailColors;
        let electron, electronGlow;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Longueur de la traînée (8000 points)
        const trailLength = 8000;

        // Outils de couleur
        const tempColor = new THREE.Color();
        const colorRed = new THREE.Color(0xef4444);  // Rouge (Noyau Sphère)
        const colorBlue = new THREE.Color(0x3b82f6); // Bleu (Noyau Cube)

        function init() {
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x030712, 0.015);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 40;

                // THREE.JS RENDERER (IMPORTANT : preserveDrawingBuffer permet de capturer l'image)
                renderer = new THREE.WebGLRenderer({
                        antialias: true,
                        preserveDrawingBuffer: true // 👈 NECESSAIRE POUR LA CAPTURE D'ECRAN
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                rotationGroup = new THREE.Group();
                scene.add(rotationGroup);

                // ==================== A. NOYAU MUTANT ====================
                const detail = 32;
                const coreGeometry = new THREE.SphereGeometry(1, detail, detail);
                basePositions = coreGeometry.attributes.position.clone();

                coreMaterial = new THREE.MeshBasicMaterial({
                        color: 0xef4444,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.35
                });

                coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
                rotationGroup.add(coreSphere);

                // ==================== B. TRAÎNÉE PERSISTANTE ====================
                trailGeometry = new THREE.BufferGeometry();
                trailPositions = new Float32Array(trailLength * 3);
                trailColors = new Float32Array(trailLength * 3);

                trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
                trailGeometry.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));

                const trailMaterial = new THREE.LineBasicMaterial({
                        vertexColors: true,
                        transparent: true,
                        opacity: 0.9
                });

                const trail = new THREE.Line(trailGeometry, trailMaterial);
                rotationGroup.add(trail);

                // Électron & Halo
                electron = new THREE.Mesh(
                        new THREE.SphereGeometry(0.45, 24, 24),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
                );
                rotationGroup.add(electron);

                electronGlow = new THREE.Mesh(
                        new THREE.SphereGeometry(1.2, 20, 20),
                        new THREE.MeshBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.2 })
                );
                rotationGroup.add(electronGlow);

                // Événements
                window.addEventListener('mousedown', e => { if (!e.target.closest('#ui')) isDragging = true; });
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', () => isDragging = false);
                window.addEventListener('resize', onWindowResize);

                animate();
        }

        function onMouseMove(e) {
                if (isDragging) {
                        rotationGroup.rotation.y += (e.clientX - previousMousePosition.x) * 0.005;
                        rotationGroup.rotation.x += (e.clientY - previousMousePosition.y) * 0.005;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== BOUCLE PRINCIPALE ====================
        function animate() {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.001;

                if (!isDragging) {
                        rotationGroup.rotation.y += 0.001;
                        rotationGroup.rotation.z += 0.0002;
                }

                // ==================== 1. MORPHING NOYAU ====================
                const morphFactor = (Math.sin(time * 1.5) + 1) / 2;
                const currentSize = THREE.MathUtils.lerp(2.5, 7.5, morphFactor);
                coreMaterial.color.copy(colorRed).lerp(colorBlue, morphFactor);

                const posAttr = coreSphere.geometry.attributes.position;
                const vertex = new THREE.Vector3();
                const sphereVertex = new THREE.Vector3();

                for (let i = 0; i < posAttr.count; i++) {
                        sphereVertex.fromBufferAttribute(basePositions, i);
                        const maxCoord = Math.max(Math.abs(sphereVertex.x), Math.abs(sphereVertex.y), Math.abs(sphereVertex.z));
                        const cubeX = sphereVertex.x / (maxCoord || 1);
                        const cubeY = sphereVertex.y / (maxCoord || 1);
                        const cubeZ = sphereVertex.z / (maxCoord || 1);

                        vertex.x = THREE.MathUtils.lerp(sphereVertex.x, cubeX, morphFactor);
                        vertex.y = THREE.MathUtils.lerp(sphereVertex.y, cubeY, morphFactor);
                        vertex.z = THREE.MathUtils.lerp(sphereVertex.z, cubeZ, morphFactor);

                        const noise = Math.sin(vertex.x * 3 + time * 5) * 0.15;
                        vertex.multiplyScalar(currentSize + noise);
                        posAttr.setXYZ(i, vertex.x, vertex.y, vertex.z);
                }
                posAttr.needsUpdate = true;

                // ==================== 2. TRAJECTOIRE CHAOTIQUE ====================
                const t = time * 0.4;
                const radius = 14 + Math.sin(t * 0.3) * 4 + Math.cos(t * 0.7) * 3;

                let x = Math.sin(t * 0.8 + Math.cos(t * 0.2)) * radius
                            + Math.sin(t * 2.1) * 3;

                let y = Math.cos(t * 0.6 + Math.sin(t * 0.3)) * (radius * 0.8)
                            + Math.cos(t * 1.7) * 4;

                let z = Math.sin(t * 1.1 + Math.sin(t * 0.5)) * (radius * 0.9)
                            + Math.sin(t * 2.5) * 3;

                electron.position.set(x, y, z);
                electronGlow.position.set(x, y, z);

                // ==================== 3. TRAÎNÉE INFINIE ====================
                for (let i = trailLength - 1; i > 0; i--) {
                        trailPositions[i * 3 + 0] = trailPositions[(i - 1) * 3 + 0];
                        trailPositions[i * 3 + 1] = trailPositions[(i - 1) * 3 + 1];
                        trailPositions[i * 3 + 2] = trailPositions[(i - 1) * 3 + 2];
                }
                trailPositions[0] = x;
                trailPositions[1] = y;
                trailPositions[2] = z;
                trailGeometry.attributes.position.needsUpdate = true;

                const colorsArr = trailGeometry.attributes.color.array;
                const rainbowSpeed = time * 0.25;
                const numberOfCycles = 6.0;

                for (let i = 0; i < trailLength; i++) {
                        const factor = i / (trailLength - 1);
                        const hue = (rainbowSpeed + factor * numberOfCycles) % 1.0;
                        tempColor.setHSL(hue, 1.0, 0.55);

                        colorsArr[i * 3 + 0] = tempColor.r;
                        colorsArr[i * 3 + 1] = tempColor.g;
                        colorsArr[i * 3 + 2] = tempColor.b;
                }
                trailGeometry.attributes.color.needsUpdate = true;

                renderer.render(scene, camera);
        }

        // ==================== FONCTION DE CAPTURE D'ÉCRAN (MÉTHODE RADICALE) ====================
        function takeSnapshot() {
            // 1. Force un rendu immédiat pour être sûr d'avoir l'image à jour
            renderer.render(scene, camera);

            // 2. Convertit le Canvas en URL Data Image PNG
            // IMPORTANT : Vérifie bien que preserveDrawingBuffer: true est activé dans init() !
            const dataURL = renderer.domElement.toDataURL('image/png');

            // 3. Ouvre l'image dans un nouvel onglet
            const newWindow = window.open();
            if (newWindow) {
                // Crée un titre propre pour l'onglet
                const dateStr = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                newWindow.document.title = `Capture Atome Hydrogène - ${dateStr}`;

                // Injecte l'image dans le nouvel onglet
                newWindow.document.body.innerHTML = `<img src="${dataURL}" style="max-width:100%; height:auto;" alt="Capture Atome">`;

                // Petit message d'aide
                const helpText = document.createElement('p');
                helpText.innerText = "Faites un clic droit (ou appui long) sur l'image pour l'enregistrer.";
                helpText.style.cssText = "position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.7); color:white; padding:10px; border-radius:5px; font-family:sans-serif;";
                newWindow.document.body.appendChild(helpText);

                // 4. Petit message de confirmation sur l'UI principale
                const output = document.getElementById('output');
                output.innerHTML = `<b style="color:#60a5fa">📸 Image ouverte dans un nouvel onglet !</b>`;
                setTimeout(() => {
                    output.innerHTML = "L'électron dessine une toile arc-en-ciel infinie autour du noyau sans jamais s'effacer.";
                }, 2000);
            } else {
                // Si les popups sont bloquées
                alert("Veuillez autoriser les popups pour ce site afin de voir la capture.");
            }
        }

        init();
</script>
</body>
</html>
