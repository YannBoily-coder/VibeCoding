<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ADN Vibratoire + Micro-Particules Lumineuses</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020208; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === SETUP SCÈNE & RENDERER ===
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.009);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 54);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // === ECLAIRAGE ===
        scene.add(new THREE.AmbientLight(0x181830, 0.5));

        const light1 = new THREE.PointLight(0x00ffcc, 2.5, 150);
        light1.position.set(32, 38, 32);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff66aa, 2.0, 150);
        light2.position.set(-32, -32, 32);
        scene.add(light2);

        // === PARAMÈTRES ADN ===
        const turns = 9;
        const height = 48;
        const radius = 4.4;
        const pointsPerTurn = 44;
        const totalPoints = turns * pointsPerTurn;
        const basePairsEvery = 4;

        const helixGroup = new THREE.Group();
        scene.add(helixGroup);

        // Geometry + Materials pour InstancedMesh (Optimisation majeure GPU)
        const sphereGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const materialA = new THREE.MeshStandardMaterial({
            color: 0x00ffcc, roughness: 0.2, metalness: 0.6, emissive: 0x00ffcc, emissiveIntensity: 0.5
        });
        const materialB = new THREE.MeshStandardMaterial({
            color: 0xff66aa, roughness: 0.2, metalness: 0.6, emissive: 0xff66aa, emissiveIntensity: 0.5
        });

        const meshA = new THREE.InstancedMesh(sphereGeo, materialA, totalPoints);
        const meshB = new THREE.InstancedMesh(sphereGeo, materialB, totalPoints);
        helixGroup.add(meshA);
        helixGroup.add(meshB);

        const dummy = new THREE.Object3D();
        const dnaDataA = [];
        const dnaDataB = [];

        for (let i = 0; i < totalPoints; i++) {
            const t = i / pointsPerTurn;
            const y = (i / totalPoints) * height - height / 2;
            const angle = t * Math.PI * 2;

            dnaDataA.push({ baseAngle: angle, baseY: y });
            dnaDataB.push({ baseAngle: angle + Math.PI, baseY: y });
        }

        // === RENDER DES PAIRES DE BASES ===
        const baseSegments = Math.floor(totalPoints / basePairsEvery);
        const pointsPerBase = 12;
        const totalLinePoints = baseSegments * (pointsPerBase - 1) * 2;

        const baseLinePositions = new Float32Array(totalLinePoints * 3);
        const baseLineGeometry = new THREE.BufferGeometry();
        baseLineGeometry.setAttribute('position', new THREE.BufferAttribute(baseLinePositions, 3));

        const baseLineMaterial = new THREE.LineBasicMaterial({
            color: 0xffee88,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const baseLinesMesh = new THREE.LineSegments(baseLineGeometry, baseLineMaterial);
        helixGroup.add(baseLinesMesh);

        // === PARTICULES LUMINEUSES ET TRAÎNÉES ===
        const particleCount = 1400;
        const trailLength = 12;
        const totalTrailPoints = particleCount * trailLength;

        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        const trailPositions = new Float32Array(totalTrailPoints * 3);
        const trailColors = new Float32Array(totalTrailPoints * 3);
        const trailAlphas = new Float32Array(totalTrailPoints);

        const particlesData = [];
        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = radius + 2.0 + Math.random() * 12;
            const y = (Math.random() - 0.5) * height * 1.4;

            positions[i * 3]     = Math.cos(angle) * r;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = Math.sin(angle) * r;

            // 🔹 TAILLE RÉDUITE ICI (0.6 à 1.4 au lieu de 1.5 à 4.0)
            sizes[i] = 0.6 + Math.random() * 0.8;

            const hue = Math.random();
            const c = new THREE.Color().setHSL(hue, 0.95, 0.65);
            colors[i * 3]     = c.r;
            colors[i * 3 + 1] = c.g;
            colors[i * 3 + 2] = c.b;

            const history = new Float32Array(trailLength * 3);
            for (let t = 0; t < trailLength; t++) {
                history[t * 3]     = positions[i * 3];
                history[t * 3 + 1] = y;
                history[t * 3 + 2] = positions[i * 3 + 2];
            }

            particlesData.push({
                angle: angle,
                radius: r,
                y: y,
                angleSpeed: (Math.random() - 0.5) * 0.025 + (Math.random() > 0.5 ? 0.008 : -0.008),
                ySpeed: (Math.random() - 0.5) * 0.05,
                pull: 0.001 + Math.random() * 0.0015,
                hue: hue,
                hueSpeed: 0.0015 + Math.random() * 0.003,
                phase: Math.random() * Math.PI * 2,
                history: history
            });
        }

        // Points Géométrie
        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: { pixelRatio: { value: renderer.getPixelRatio() } },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                uniform float pixelRatio;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    // 🔹 TAMPON DE TAILLE RÉDUIT DE 320.0 À 130.0
                    gl_PointSize = size * pixelRatio * (130.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float alpha = pow(1.0 - smoothstep(0.0, 0.5, d), 1.5);
                    gl_FragColor = vec4(vColor + vec3(0.1), alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeo, particleMaterial);
        scene.add(particles);

        // Traînées Géométrie
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
        trailGeo.setAttribute('alpha', new THREE.BufferAttribute(trailAlphas, 1));

        const trailMaterial = new THREE.ShaderMaterial({
            uniforms: { pixelRatio: { value: renderer.getPixelRatio() } },
            vertexShader: `
                attribute float alpha;
                attribute vec3 color;
                varying vec3 vColor;
                varying float vAlpha;
                uniform float pixelRatio;
                void main() {
                    vColor = color;
                    vAlpha = alpha;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    // 🔹 TAILLE DE LA TRAÎNÉE RÉDUITE (90.0 au lieu de 240.0)
                    gl_PointSize = (0.8 + alpha * 1.5) * pixelRatio * (90.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float alpha = (1.0 - smoothstep(0.0, 0.5, d)) * vAlpha;
                    gl_FragColor = vec4(vColor, alpha * 0.6);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const trails = new THREE.Points(trailGeo, trailMaterial);
        scene.add(trails);

        // === BRUIT ET ANIMATION ===
        const noise = new Float32Array(totalPoints * 3);
        for (let i = 0; i < totalPoints; i++) {
            noise[i * 3]     = Math.random() * Math.PI * 2;
            noise[i * 3 + 1] = 0.2 + Math.random() * 0.8;
            noise[i * 3 + 2] = 0.15 + Math.random() * 0.35;
        }

        let time = 0;
        const tempColor = new THREE.Color();
        const posA = new THREE.Vector3();
        const posB = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            helixGroup.rotation.y = time * 0.1;

            // 1. Mise à jour ADN
            let lineIndex = 0;
            const linePosArr = baseLineGeometry.attributes.position.array;

            for (let i = 0; i < totalPoints; i++) {
                const nPhaseA = noise[i * 3], nSpeedA = noise[i * 3 + 1], nAmpA = noise[i * 3 + 2];
                const twistA = Math.sin(time * nSpeedA + nPhaseA) * nAmpA;
                const extraRA = Math.sin(time * 0.58 + i * 0.08) * 0.5;
                const angleA = dnaDataA[i].baseAngle + twistA + time * 0.25;
                const rA = radius + extraRA;

                posA.set(
                    Math.cos(angleA) * rA,
                    dnaDataA[i].baseY + Math.sin(time * 1.0 + i * 0.06) * 0.4,
                    Math.sin(angleA) * rA
                );
                dummy.position.copy(posA);
                dummy.updateMatrix();
                meshA.setMatrixAt(i, dummy.matrix);

                const twistB = Math.sin(time * nSpeedA + nPhaseA + 1.5) * nAmpA;
                const extraRB = Math.sin(time * 0.58 + i * 0.08 + 1.3) * 0.5;
                const angleB = dnaDataB[i].baseAngle + twistB + time * 0.25;
                const rB = radius + extraRB;

                posB.set(
                    Math.cos(angleB) * rB,
                    dnaDataB[i].baseY + Math.sin(time * 1.0 + i * 0.06 + 0.8) * 0.4,
                    Math.sin(angleB) * rB
                );
                dummy.position.copy(posB);
                dummy.updateMatrix();
                meshB.setMatrixAt(i, dummy.matrix);

                if (i % basePairsEvery === 0) {
                    const dx = posB.x - posA.x, dz = posB.z - posA.z;
                    const len = Math.sqrt(dx*dx + dz*dz) || 1;
                    const px = -dz / len, pz = dx / len;

                    for (let s = 0; s < pointsPerBase - 1; s++) {
                        const t1 = s / (pointsPerBase - 1);
                        const t2 = (s + 1) / (pointsPerBase - 1);

                        const wave1 = Math.sin(t1 * Math.PI * 3.3 + time * 2.5) * 0.6;
                        const wave2 = Math.sin(t2 * Math.PI * 3.3 + time * 2.5) * 0.6;

                        linePosArr[lineIndex++] = posA.x + (posB.x - posA.x) * t1 + px * wave1;
                        linePosArr[lineIndex++] = posA.y + (posB.y - posA.y) * t1;
                        linePosArr[lineIndex++] = posA.z + (posB.z - posA.z) * t1 + pz * wave1;

                        linePosArr[lineIndex++] = posA.x + (posB.x - posA.x) * t2 + px * wave2;
                        linePosArr[lineIndex++] = posA.y + (posB.y - posA.y) * t2;
                        linePosArr[lineIndex++] = posA.z + (posB.z - posA.z) * t2 + pz * wave2;
                    }
                }
            }

            meshA.instanceMatrix.needsUpdate = true;
            meshB.instanceMatrix.needsUpdate = true;
            baseLineGeometry.attributes.position.needsUpdate = true;

            // 2. Mise à jour Particules & Traînées
            const posArr = particleGeo.attributes.position.array;
            const colArr = particleGeo.attributes.color.array;

            for (let i = 0; i < particleCount; i++) {
                const p = particlesData[i];

                const idealRadius = radius + 4.5 + Math.sin(time * 0.38 + p.phase) * 3.2;
                p.radius += (idealRadius - p.radius) * p.pull;
                p.angle += p.angleSpeed;
                p.y += p.ySpeed;

                if (p.y > height * 0.75 || p.y < -height * 0.75) p.ySpeed *= -0.9;

                const x = Math.cos(p.angle) * p.radius;
                const y = p.y;
                const z = Math.sin(p.angle) * p.radius;

                posArr[i * 3]     = x;
                posArr[i * 3 + 1] = y;
                posArr[i * 3 + 2] = z;

                p.hue = (p.hue + p.hueSpeed) % 1.0;
                tempColor.setHSL(p.hue, 0.95, 0.65);
                colArr[i * 3]     = tempColor.r;
                colArr[i * 3 + 1] = tempColor.g;
                colArr[i * 3 + 2] = tempColor.b;

                for (let t = trailLength - 1; t > 0; t--) {
                    p.history[t * 3]     = p.history[(t - 1) * 3];
                    p.history[t * 3 + 1] = p.history[(t - 1) * 3 + 1];
                    p.history[t * 3 + 2] = p.history[(t - 1) * 3 + 2];
                }
                p.history[0] = x;
                p.history[1] = y;
                p.history[2] = z;

                for (let t = 0; t < trailLength; t++) {
                    const idx = (i * trailLength + t) * 3;
                    trailPositions[idx]     = p.history[t * 3];
                    trailPositions[idx + 1] = p.history[t * 3 + 1];
                    trailPositions[idx + 2] = p.history[t * 3 + 2];

                    trailColors[idx]     = tempColor.r;
                    trailColors[idx + 1] = tempColor.g;
                    trailColors[idx + 2] = tempColor.b;

                    trailAlphas[i * trailLength + t] = 1.0 - (t / trailLength);
                }
            }

            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;

            trailGeo.attributes.position.needsUpdate = true;
            trailGeo.attributes.color.needsUpdate = true;
            trailGeo.attributes.alpha.needsUpdate = true;

            particles.rotation.y = time * 0.05;
            trails.rotation.y = time * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
