<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Langage X Bi-directionnel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
        }
        .field-group {
            margin-bottom: 20px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .btn-copy {
            background: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: #475569;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: #f8fafc;
            font-size: 1.1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        #xText {
            font-size: 1.3rem;
            letter-spacing: 0.08em;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Convertisseur Langage X Bi-directionnel</h1>

    <div class="field-group">
        <div class="label-row">
            <label for="latinText">TEXTE LATIN</label>
            <button class="btn-copy" onclick="copier('latinText', this)">Copier</button>
        </div>
        <textarea id="latinText" placeholder="Tape ton texte ici..."></textarea>
    </div>

    <div class="field-group">
        <div class="label-row">
            <label for="xText">ALPHABET EN X</label>
            <button class="btn-copy" onclick="copier('xText', this)">Copier</button>
        </div>
        <textarea id="xText" placeholder="...╳✖✗ 𝕏※𝕏𝗑𝗑..."></textarea>
    </div>
</div>

<script>
    // Dictionnaire combinant des croix, des lettres ressemblant à X (grec, cyrillique) et des symboles mathématiques.
    const latinToX = [
        ['th', '⨂'], ['ng', '☒'], ['ei', '⛌'],
        ['a', 'x'], ['b', 'X'], ['c', '×'], ['d', '✖'],
        ['e', '✗'], ['f', '✘'], ['g', '╳'], ['h', '⨯'],
        ['i', '⨉'], ['j', 'χ'], ['k', 'Χ'], ['l', 'х'],
        ['m', 'Х'], ['n', 'ꭓ'], ['o', 'ᚷ'], ['p', '𝕩'],
        ['q', '𝕏'], ['r', '𝓍'], ['s', '𝔁'], ['t', '𝖝'],
        ['u', '𝗑'], ['v', 'ⵝ'], ['w', 'ⴵ'], ['x', '※'],
        ['y', '⨝'], ['z', '⋈'],
        ['é', '✗'], ['è', '✗'], ['ê', '✗'], ['à', 'x'], ['â', 'x'], ['ù', '𝗑']
    ];

    const xToLatin = [
        ['⨂', 'th'], ['☒', 'ng'], ['⛌', 'ei'],
        ['x', 'a'], ['X', 'b'], ['×', 'c'], ['✖', 'd'],
        ['✗', 'e'], ['✘', 'f'], ['╳', 'g'], ['⨯', 'h'],
        ['⨉', 'i'], ['χ', 'j'], ['Χ', 'k'], ['х', 'l'],
        ['Х', 'm'], ['ꭓ', 'n'], ['ᚷ', 'o'], ['𝕩', 'p'],
        ['𝕏', 'q'], ['𝓍', 'r'], ['𝔁', 's'], ['𝖝', 't'],
        ['𝗑', 'u'], ['ⵝ', 'v'], ['ⴵ', 'w'], ['※', 'x'],
        ['⨝', 'y'], ['⋈', 'z']
    ];

    const latinInput = document.getElementById('latinText');
    const xInput = document.getElementById('xText');

    // Saisie côté Latin -> Conversion X
    latinInput.addEventListener('input', () => {
        let txt = latinInput.value.toLowerCase();
        for (const [cle, symbole] of latinToX) {
            txt = txt.replaceAll(cle, symbole);
        }
        xInput.value = txt;
    });

    // Saisie côté X -> Conversion Latin
    xInput.addEventListener('input', () => {
        let txt = xInput.value;
        // L'ordre est déjà optimisé dans xToLatin pour éviter que les "x" de base n'interfèrent avec le reste
        for (const [symbole, latin] of xToLatin) {
            txt = txt.replaceAll(symbole, latin);
        }
        latinInput.value = txt;
    });

    // Fonction de copie dans le presse-papier
    function copier(idElement, btn) {
        const el = document.getElementById(idElement);
        if (!el.value) return;
        
        navigator.clipboard.writeText(el.value).then(() => {
            const txtOriginal = btn.textContent;
            btn.textContent = 'Copié !';
            btn.style.background = '#0284c7';
            setTimeout(() => {
                btn.textContent = txtOriginal;
                btn.style.background = '#334155';
            }, 1200);
        });
    }
</script>

</body>
</html>
